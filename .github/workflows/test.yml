name: Clone setup and pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install dependencies and run data-free tests
        run: python dev.py setup
